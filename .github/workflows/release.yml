name: Build and release CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PDF
        run: make pdf

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cv-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          gh release create "$tag" martinknoller-cv.pdf \
            --target "$GITHUB_SHA" \
            --title "CV $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes "$(git log -1 --format=%B "$GITHUB_SHA")" \
            --latest
